name: Surveillance Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC (midnight Mountain)
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'scripts/**'
      - 'data/surveillance/**'
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write           # Needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            jupyter \
            nbconvert \
            nbformat \
            nbclient \
            pandas \
            numpy \
            matplotlib \
            requests \
            plotly \
            scipy \
            scikit-learn
          pip install -e . --no-deps

      - name: Fetch surveillance data
        run: python scripts/fetch_surveillance_data.py
        continue-on-error: true   # Dashboard still builds with sample data if APIs are down

      - name: Execute and convert notebooks
        run: |
          mkdir -p _site/notebooks
          for nb in notebooks/*.ipynb; do
            echo "Converting $nb..."
            jupyter nbconvert \
              --to html \
              --execute \
              --no-prompt \
              --ExecutePreprocessor.timeout=300 \
              --output-dir _site/notebooks \
              "$nb"
          done

      - name: Make notebook query cells collapsible
        run: |
          python - <<'PY'
          from pathlib import Path

          snippet = """
          <style>
          .code-toggle-btn {
            margin: 0.4rem 0 0.2rem;
            padding: 0.25rem 0.55rem;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #f6f8fa;
            color: #24292f;
            font-size: 0.82rem;
            cursor: pointer;
          }
          .code-toggle-btn:hover { background: #eef2f6; }
          .jp-InputArea.jp-Cell-inputArea.collapsed-query { display: none; }
          </style>
          <script>
          document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.jp-CodeCell').forEach(function (cell) {
              const input = cell.querySelector('.jp-InputArea.jp-Cell-inputArea');
              if (!input) return;

              input.classList.add('collapsed-query');
              const button = document.createElement('button');
              button.className = 'code-toggle-btn';
              button.type = 'button';
              button.textContent = 'Show query';

              button.addEventListener('click', function () {
                const isCollapsed = input.classList.contains('collapsed-query');
                if (isCollapsed) {
                  input.classList.remove('collapsed-query');
                  button.textContent = 'Hide query';
                } else {
                  input.classList.add('collapsed-query');
                  button.textContent = 'Show query';
                }
              });

              input.parentNode.insertBefore(button, input);
            });
          });
          </script>
          """

          for html_path in Path('_site/notebooks').glob('*.html'):
            html = html_path.read_text(encoding='utf-8')
            if 'code-toggle-btn' in html:
              continue
            html = html.replace('</head>', f'{snippet}\n</head>', 1)
            html_path.write_text(html, encoding='utf-8')
            print(f'Updated {html_path}')
          PY

      - name: Generate dashboard index page
        run: python scripts/generate_dashboard.py

      - name: Copy static assets
        run: |
          cp -r docs/css _site/css 2>/dev/null || true
          cp -r docs/images _site/images 2>/dev/null || true

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          commit_message: "dashboard: automated update ${{ github.run_number }} [skip ci]"
